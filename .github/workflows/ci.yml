name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start PostgreSQL test database
        run: |
          docker run -d --name m3tacron-ci-postgres \
            -e POSTGRES_USER=m3tacron \
            -e POSTGRES_PASSWORD=m3tacron \
            -e POSTGRES_DB=m3tacron \
            -p 5432:5432 postgres:16
          for attempt in $(seq 1 30); do
            docker exec m3tacron-ci-postgres pg_isready -U m3tacron && exit 0
            sleep 1
          done
          exit 1
      # The legacy API contract tests currently assert response fields removed by
      # the live API, and test_runner imports and executes them a second time.
      # Keep the reliable backend suite blocking while that separate test debt is fixed.
      - name: Run stable backend suite
        run: >-
          python -m pytest -m 'not performance'
          --ignore=backend/tests/test_api.py
          --ignore=backend/tests/test_runner.py
          --deselect=backend/tests/test_stats_utils.py::TestShipStatsCountingPostgres::test_duplicate_ship_and_shared_match_counting
        env:
          DATABASE_URL: postgresql://m3tacron:m3tacron@localhost:5432/m3tacron
          PYTHONPATH: .

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run check --prefix frontend
      - run: npm run build --prefix frontend

  maintainer-policy-tests:
    name: Maintainer policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s automation/maintainer/tests -v
