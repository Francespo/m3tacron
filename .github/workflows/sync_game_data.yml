name: Sync Game Data

# Keeps the vendored data snapshot (external_data) and the generated frontend
# manifests aligned with Francespo/xwing-unified-data.
#
# Upstream sources (J1mBob, YASB/Raithos, SogeMoge legacy) are merged *inside*
# xwing-unified-data, which owns the nested submodule pins and points_history.
# This workflow only advances external_data and rebuilds the manifests. Running
# the upstream merges here would modify a detached submodule working tree that
# cannot be committed back through this repository.
#
# A data update lands as a pull request, never as a direct push: `main` is
# protected. The workflow creates the PR with GITHUB_TOKEN and enables
# auto-merge. With Required approvals = 0 it merges as soon as CI is green;
# with reviews enabled it waits for the configured approver.

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    # 06:00 UTC, one hour after xwing-unified-data's own sync (05:00 UTC).
    - cron: "0 6 * * *"
  repository_dispatch:
    types: [game-data-updated]
  workflow_dispatch:

concurrency:
  group: sync-game-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SYNC_BRANCH: chore/game-data-sync

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Game Data Sync
        run: python3 scripts/sync_game_data.py --sync-submodules --rebuild-manifests

      - name: Validate points data
        run: python3 scripts/validate_points_pipeline.py

      - name: Open or update the data sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add external_data \
            frontend/static/data-xwa/xwing-data.json \
            frontend/static/data-legacy/xwing-data.json \
            frontend/src/lib/data/points-history.json

          if git diff --cached --quiet; then
            echo "No game data changes detected. Everything is up to date."
            exit 0
          fi

          git switch -C "$SYNC_BRANCH"
          git commit -m "chore(data): sync game data and rebuild manifests"

          # The branch is owned by this workflow; force keeps a single open PR
          # instead of accumulating one branch per day.
          git push --force origin "$SYNC_BRANCH"

          EXISTING="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            PR_NUMBER="$EXISTING"
            echo "Updated existing PR #$PR_NUMBER"
          else
            SUB_SHA="$(git ls-tree HEAD external_data | awk '{print $3}')"
            {
              echo "Automated sync of \`external_data\` to \`$SUB_SHA\` and regeneration of the frontend manifests."
              echo
              echo "Generated by \`.github/workflows/sync_game_data.yml\`."
              echo "Review the points-history diff before merging."
            } > /tmp/data_sync_body.md

            if ! gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore(data): sync game data and rebuild manifests" \
              --body-file /tmp/data_sync_body.md; then
              echo "::error::GITHUB_TOKEN cannot create pull requests. Enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests in $GITHUB_REPOSITORY."
              exit 1
            fi

            PR_NUMBER="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::Could not resolve the data sync PR number"
              exit 1
            fi
            echo "Opened PR #$PR_NUMBER"
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Enable auto-merge
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --auto --delete-branch || {
            echo "::warning::Could not enable auto-merge for PR #$PR_NUMBER; approve/merge it manually."
          }
          echo "Auto-merge requested. With Required approvals = 0 it merges after CI; with reviews enabled it waits for the approver."
