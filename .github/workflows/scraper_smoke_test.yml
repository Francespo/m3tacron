name: Scraper Smoke Test

# One-off: verify the Longshanks team-event scraper works ON a GitHub
# hosted runner (egress to the platform + chromium + DOM parsing).

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "Longshanks event id to scrape"
        required: true
        default: "32155"
      subdomain:
        description: "xwing or xwing-legacy"
        required: true
        default: "xwing"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Egress check to Longshanks
        run: |
          for host in https://xwing.longshanks.org/ https://xwing-legacy.longshanks.org/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$host" || echo TIMEOUT)
            echo "$host -> $code"
          done

      - name: Install Playwright chromium (no --with-deps; ubuntu has libs)
        run: |
          playwright install chromium-headless-shell
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True, args=['--no-sandbox']); b.close(); p.stop(); print('chromium OK')"

      - name: Run Longshanks team-event scraper
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import logging
          logging.basicConfig(level=logging.INFO, format="%(message)s")
          from backend.scrapers.longshanks_scraper import LongshanksScraper

          event = "${{ inputs.event_id }}"
          sub = "${{ inputs.subdomain }}"
          s = LongshanksScraper(subdomain=sub)
          out = s.get_participants(event)
          members = [p for p in out if p.is_team_member]
          teams = [p for p in out if not p.is_team_member]
          print(f"event={event} subdomain={sub}")
          print(f"is_team_event={s.is_team_event}")
          print(f"members={len(members)} teams={len(teams)}")
          for m in members[:8]:
              print(f"  member: {m.player_name!r} -> team={getattr(m,'team_name',None)!r}")
          for t in teams[:4]:
              print(f"  team row: {t.player_name!r}")
          if not members:
              raise SystemExit("FAIL: no members scraped on runner")
          PY
