name: Database Repair

# One-off / on-demand database maintenance for m3tacron.
#
# Currently implements the team-event migration (schema + re-roster of the
# legacy team tournaments) against a target database (default staging), plus
# a Legacy Pandorum format backfill for tournaments whose lists came from
# albogarelli.github.io/pandorumbuilder.
#
# IMPORTANT: All DB writes are scoped to the `environment` input. Never run
# this against `prod` without a backup + explicit confirmation.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target database (staging recommended; prod requires backup)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
      skip_reroaster:
        description: "Schema + backfill only (no 41-event re-scrape). Safer first pass."
        required: true
        default: "false"
        type: boolean
      event_id:
        description: "Only re-roster a single tournament id (optional, e.g. 11899)"
        required: false
        type: string

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Cache the Playwright browser so repeat runs don't cold-download
      # chromium (~180MB) from the CDN — which is what was stalling runs.
      - name: Cache Playwright browsers
        if: inputs.skip_reroaster != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: inputs.skip_reroaster != 'true'
        run: |
          set -e
          # Ubuntu-latest already ships the chromium system libraries, so skip
          # --with-deps (its apt phase is what kept stalling). Install the
          # headless shell only — it's ~115MB vs ~300MB for full chromium and
          # is what headless=True uses.
          for i in 1 2 3; do
            echo "playwright install attempt $i"
            if timeout 240 playwright install chromium-headless-shell; then
              break
            fi
            echo "attempt $i failed; retrying..."
            sleep 5
          done
          # Verify the browser actually got installed and can launch.
          timeout 60 python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True, args=['--no-sandbox']); b.close(); p.stop(); print('chromium OK')"

      - name: Open SSH tunnel to database
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > /tmp/m3tacron_deploy_key
          tail -c1 /tmp/m3tacron_deploy_key | read -r _ || echo >> /tmp/m3tacron_deploy_key
          chmod 600 /tmp/m3tacron_deploy_key
          eval $(ssh-agent -s)
          ssh-add /tmp/m3tacron_deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          rm -f /tmp/m3tacron_deploy_key

      - name: Start database tunnel
        env:
          RAW: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          ssh -f -N -L 5432:localhost:3000 \
            -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes \
            audit-bot@84.8.253.2
          # Wait for the tunnel using psycopg2 (installed via requirements) —
          # avoids the apt-get postgresql-client install that stalls runners.
          # Auth: use the DB password from PROD_DATABASE_URL (same instance).
          python - <<'PY'
          import os, time
          from urllib.parse import urlparse
          import psycopg2
          raw = os.environ.get("RAW", "")
          passwd = urlparse(raw).password if "://" in raw else raw
          for i in range(25):
              try:
                  psycopg2.connect(host="localhost", port=5432, user="postgres",
                                   password=passwd, connect_timeout=3).close()
                  print("Tunnel ready.")
                  break
              except Exception as exc:
                  time.sleep(1)
                  if i == 24:
                      raise SystemExit(f"ERROR: DB tunnel failed: {exc}")
          PY

      - name: Resolve DATABASE_URL
        id: db
        env:
          RAW: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          PASS=$(python3 -c "from urllib.parse import urlparse; import sys; u=urlparse(sys.argv[1]); print(u.password or sys.argv[1])" "$RAW")
          echo "::add-mask::$PASS"
          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "url=postgres://postgres:${PASS}@localhost:5432/postgres" >> "$GITHUB_OUTPUT"
          else
            echo "url=postgres://postgres:${PASS}@localhost:5432/m3tacron_staging" >> "$GITHUB_OUTPUT"
          fi

      # --- Schema-only pass (no scraping): run on the runner via tunnel ---
      - name: Team-event migration (schema only)
        if: inputs.skip_reroaster == 'true'
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
          PYTHONPATH: .
        run: |
          python -m backend.scripts.migrate_team_events --skip-reroaster

      # --- Re-roster pass: run ON THE SERVER via SSH ---
      # GitHub-hosted runner egress cannot reliably reach xwing.longshanks.org,
      # but the server (84.8.253.2) can. The GH workflow orchestrates; the
      # migration executes where the platform is reachable.
      - name: Team-event re-roster (on server via SSH)
        if: inputs.skip_reroaster != 'true'
        env:
          RAW: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -e
          PASS=$(python3 -c "from urllib.parse import urlparse; import sys; u=urlparse(sys.argv[1]); print(u.password or sys.argv[1])" "$RAW")
          echo "::add-mask::$PASS"

          # 1. Sync the branch code to the server's prod backend container.
          #    The container runs as root with working Playwright chromium
          #    (headless shell + X libs installed) and reaches postgres by
          #    docker network name — this is the only environment on the
          #    server that can both reach Longshanks AND run a browser.
          tar -C backend -czf - . \
            | ssh -o StrictHostKeyChecking=no audit-bot@84.8.253.2 \
              "docker exec -i backend-d1237bghfe3rxgm7ahj00z8l-212035540797 sh -c 'cat > /tmp/backend.tgz && cd /app && rm -rf backend.new && mkdir -p backend.new && tar -xzf /tmp/backend.tgz -C backend.new && mv backend backend.old 2>/dev/null; mv backend.new backend && rm -f /tmp/backend.tgz'"
          scp -o StrictHostKeyChecking=no requirements.txt \
            audit-bot@84.8.253.2:/tmp/requirements.txt
          ssh -o StrictHostKeyChecking=no audit-bot@84.8.253.2 \
            "docker cp /tmp/requirements.txt backend-d1237bghfe3rxgm7ahj00z8l-212035540797:/tmp/requirements.txt && docker exec backend-d1237bghfe3rxgm7ahj00z8l-212035540797 sh -c 'pip install --quiet -r /tmp/requirements.txt 2>/dev/null || true'"

          # 2. Run the migration inside the container against staging (or prod).
          EXTRA=""
          if [ -n "${{ inputs.event_id }}" ]; then EXTRA="--event ${{ inputs.event_id }}"; fi
          DBENV="${{ inputs.environment }}"
          if [ "$DBENV" = "prod" ]; then DBNAME="postgres"; else DBNAME="m3tacron_staging"; fi
          ssh -o StrictHostKeyChecking=no audit-bot@84.8.253.2 \
            "docker exec -e DATABASE_URL='postgresql://postgres:${PASS}@rdvq2p6xwxho16pbcyd40w0d:5432/${DBNAME}' \
              -e PYTHONPATH=/app \
              backend-d1237bghfe3rxgm7ahj00z8l-212035540797 \
              python -m backend.scripts.migrate_team_events ${EXTRA}"

      - name: Legacy Pandorum format backfill
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"].replace("postgres://", "postgresql://", 1))
          with engine.begin() as conn:
              # Detect tournaments whose lists come from the Pandorum builder.
              rows = conn.execute(text("""
                  SELECT DISTINCT ps.tournament_id
                  FROM playerstanding ps
                  WHERE ps.list_json->'vendor' ? 'yasb'
                    AND (ps.list_json->'vendor'->'yasb'->>'builder_url') ILIKE '%pandorumbuilder%'
              """)).fetchall()
              ids = [r[0] for r in rows]
              if not ids:
                  print("No Pandorum tournaments detected.")
              else:
                  res = conn.execute(text(
                      "UPDATE tournament SET format = 'legacy_pandorum' WHERE id = ANY(:ids)"
                  ), {"ids": ids})
                  print(f"Set legacy_pandorum on {res.rowcount} tournament(s): {ids}")

              # Cache invalidation
              row = conn.execute(text("SELECT value FROM scrape_meta WHERE key='data_version'")).first()
              if row:
                  try:
                      new_val = str(int(row[0]) + 1)
                  except (ValueError, TypeError):
                      new_val = "1"
                  conn.execute(text("UPDATE scrape_meta SET value=:v WHERE key='data_version'"), {"v": new_val})
              else:
                  conn.execute(text("INSERT INTO scrape_meta (key,value) VALUES ('data_version','1')"))
              print("data_version bumped.")
          PY

      - name: Summary
        env:
          DATABASE_URL: ${{ steps.db.outputs.url }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"].replace("postgres://", "postgresql://", 1))
          with engine.connect() as conn:
              for label, q in [
                  ("tournaments", "SELECT count(*) FROM tournament"),
                  ("team events", "SELECT count(*) FROM tournament WHERE is_team_event"),
                  ("team_member rows", "SELECT count(*) FROM team_member"),
                  ("members (is_team_member)", "SELECT count(*) FROM playerstanding WHERE is_team_member"),
                  ("legacy_pandorum tournaments", "SELECT count(*) FROM tournament WHERE format='legacy_pandorum'"),
                  ("null-FK team matches", "SELECT count(*) FROM match m JOIN tournament t ON t.id=m.tournament_id WHERE t.is_team_event AND (m.player1_id IS NULL OR m.player2_id IS NULL)"),
              ]:
                  print(f"{label}: {conn.execute(text(q)).scalar()}")
          PY
