name: Egress Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://xwing.longshanks.org/ || echo "TIMEOUT")
            echo "attempt $i: $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -s -o /dev/null -w "listfortress: %{http_code}\n" --max-time 20 https://listfortress.com/ || echo "LF TIMEOUT"
          curl -s -o /dev/null -w "rollbetter: %{http_code}\n" --max-time 20 https://rollbetter.gg/ || echo "RB TIMEOUT"
