name: Scrape Tournaments

permissions:
  contents: write

on:
  schedule:
    # Run at 08:00 UTC every day — writes to staging (promote via separate workflow)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to scrape"
        required: true
        default: "longshanks+rollbetter"
        type: choice
        options:
          - longshanks+rollbetter
          - longshanks
          - rollbetter
          - listfortress
          - all
      time_range:
        description: |
          Time range to scrape.

          Single day:    today | yesterday | YYYY-MM-DD
          Range keyword: last 3 days | last week | last month | last 3 months | last 6 months | last year | all time
          Explicit range: YYYY-MM-DD:YYYY-MM-DD | YYYY-MM-DD:today | YYYY-MM-DD:yesterday | yesterday:today
          Legacy:        positive integer (days back from today, treated as last N days)
        required: true
        default: "yesterday"
        type: string
      environment:
        description: "Target database environment (use none for SQLite artifact only)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - prod
          - dev
          - none
      upload_sqlite_artifact:
        description: "Upload scraped SQLite database as an artifact"
        required: true
        default: true
        type: boolean
      overwrite:
        description: "Overwrite existing tournaments in the database"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Install PostgreSQL client (for pg_isready / psql)
        if: inputs.environment == 'prod' || inputs.environment == 'staging' || inputs.environment == 'dev'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Open SSH tunnel to database
        if: inputs.environment == 'prod' || inputs.environment == 'staging' || inputs.environment == 'dev'
        run: |
          # Sanitize the secret — copes with CR line endings / stray whitespace
          # from paste that breaks ssh-add (error: "error in libcrypto").
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > /tmp/m3tacron_deploy_key
          tail -c1 /tmp/m3tacron_deploy_key | read -r _ || echo >> /tmp/m3tacron_deploy_key
          chmod 600 /tmp/m3tacron_deploy_key
          eval $(ssh-agent -s)
          ssh-add /tmp/m3tacron_deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          rm -f /tmp/m3tacron_deploy_key

      - name: Start database tunnel
        if: inputs.environment == 'prod' || inputs.environment == 'staging' || inputs.environment == 'dev'
        run: |
          ssh -f -N -L 5432:localhost:3000 \
            -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes \
            audit-bot@84.8.253.2
          echo "Waiting for tunnel..."
          for i in $(seq 1 15); do
            if pg_isready -h localhost -p 5432 2>/dev/null | grep -q "accepting"; then
              echo "Tunnel ready."
              break
            fi
            sleep 1
          done
          pg_isready -h localhost -p 5432 || (echo "ERROR: DB tunnel failed" && exit 1)

      - name: Run Scraper
        env:
          PYTHONPATH: .
        run: |
          PLATFORM="${{ inputs.platform }}"
          TIME_RANGE="${{ inputs.time_range }}"
          DB_ENV="${{ inputs.environment }}"

          if [ -z "$PLATFORM" ]; then PLATFORM="longshanks+rollbetter"; fi
          if [ -z "$TIME_RANGE" ]; then TIME_RANGE="yesterday"; fi
          if [ -z "$DB_ENV" ]; then DB_ENV="staging"; fi

          # Build DATABASE_URL from secrets via SSH tunnel.
          # Secrets may be a full URL (postgres://user:pass@host/db) or just a password.
          # We extract the password and reconstruct a localhost tunnel URL.
          _extract_pass() {
            local raw="$1"
            if echo "$raw" | grep -q "://"; then
              python3 -c "from urllib.parse import urlparse; import sys; u=urlparse(sys.argv[1]); print(u.password or '')" "$raw"
            else
              echo "$raw"
            fi
          }

          if [ "$DB_ENV" = "prod" ]; then
            RAW="${{ secrets.PROD_DATABASE_URL }}"
            PASS=$(_extract_pass "$RAW")
            export DATABASE_URL="postgres://postgres:${PASS}@localhost:5432/postgres"
          elif [ "$DB_ENV" = "staging" ]; then
            RAW="${{ secrets.PROD_DATABASE_URL }}"
            PASS=$(_extract_pass "$RAW")
            export DATABASE_URL="postgres://postgres:${PASS}@localhost:5432/m3tacron_staging"
          elif [ "$DB_ENV" = "dev" ]; then
            RAW="${{ secrets.DEV_DATABASE_URL }}"
            PASS=$(_extract_pass "$RAW")
            # Dev DB — if it lives on the same Postgres, use the tunnel.
            # If your dev DB is elsewhere, override by setting DEV_DATABASE_URL to the full direct URL
            # and uncomment the next line:
            # export DATABASE_URL="$RAW"
            export DATABASE_URL="postgres://postgres:${PASS}@localhost:5432/postgres"
          fi

          OVERWRITE_FLAG=""
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            OVERWRITE_FLAG="--overwrite"
          fi

          if [ "$DB_ENV" = "none" ]; then
            python -m backend.scripts.scrape_tournaments_sqlite \
              --sqlite-path scraped_tournaments.db \
              --platform "$PLATFORM" \
              --time-range "$TIME_RANGE" $OVERWRITE_FLAG
          else
            python -m backend.scripts.scrape_tournaments \
              --platform "$PLATFORM" \
              --time-range "$TIME_RANGE" \
              --sqlite-output scraped_tournaments.db $OVERWRITE_FLAG
          fi

      - name: Upload Scraped Tournaments Artifact
        if: always() && hashFiles('scraped_tournaments.db') != '' && github.event.inputs.upload_sqlite_artifact != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: scraped-tournaments-${{ github.run_id }}
          path: scraped_tournaments.db
          retention-days: 30

      - name: Commit and Push Changes
        if: inputs.environment != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/geocoding_cache.json
          if [ -f main.db ]; then git add main.db; fi
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
            exit 0
          fi
          git commit -m "Update tournament data and geocoding cache"
          # main is a protected branch — direct push is rejected. Push the
          # cache commit to a dedicated branch so it isn't lost; the job
          # must NOT fail because of branch protection.
          if git branch --show-current | grep -q '^main$'; then
            CACHE_BRANCH="data/geocoding-cache"
            git branch -f "$CACHE_BRANCH" HEAD
            git push -f origin "$CACHE_BRANCH" 2>/dev/null || echo "Cache push to $CACHE_BRANCH failed (non-fatal)"
          else
            git push 2>/dev/null || echo "Cache push failed (non-fatal)"
          fi
