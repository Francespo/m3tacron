name: Scrape Tournaments

permissions:
  contents: write

on:
  schedule:
    # Run at 08:00 UTC every day — writes to prod (direct live update)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to scrape"
        required: true
        default: "longshanks+rollbetter"
        type: choice
        options:
          - longshanks+rollbetter
          - longshanks
          - rollbetter
          - listfortress
          - all
      time_range:
        description: |
          Time range to scrape.

          Single day:    today | yesterday | YYYY-MM-DD
          Range keyword: last 3 days | last week | last month | last 3 months | last 6 months | last year | all time
          Explicit range: YYYY-MM-DD:YYYY-MM-DD | YYYY-MM-DD:today | YYYY-MM-DD:yesterday | yesterday:today
          Legacy:        positive integer (days back from today, treated as last N days)
        required: true
        default: "last week"
        type: string
      environment:
        description: "Target database environment (use none for SQLite artifact only)"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - staging
          - none
      upload_sqlite_artifact:
        description: "Upload scraped SQLite database as an artifact"
        required: true
        default: true
        type: boolean
      overwrite:
        description: "Overwrite existing tournaments in the database"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    # True when the job needs the database SSH tunnel: the scheduled daily
    # run always targets prod, and workflow_dispatch targets whatever
    # environment was chosen (none = SQLite artifact only, no DB).
    env:
      NEEDS_DB: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.environment != 'none') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Install PostgreSQL client (for pg_isready / psql)
        if: env.NEEDS_DB == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Open SSH tunnel to database
        if: env.NEEDS_DB == 'true'
        run: |
          # Sanitize the secret — copes with CR line endings / stray whitespace
          # from paste that breaks ssh-add (error: "error in libcrypto").
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > /tmp/m3tacron_deploy_key
          tail -c1 /tmp/m3tacron_deploy_key | read -r _ || echo >> /tmp/m3tacron_deploy_key
          chmod 600 /tmp/m3tacron_deploy_key
          eval $(ssh-agent -s)
          ssh-add /tmp/m3tacron_deploy_key
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV
          rm -f /tmp/m3tacron_deploy_key

      - name: Start database tunnel
        if: env.NEEDS_DB == 'true'
        run: |
          ssh -f -N -L 5432:localhost:3000 \
            -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes \
            audit-bot@84.8.253.2
          echo "Waiting for tunnel..."
          for i in $(seq 1 15); do
            if pg_isready -h localhost -p 5432 2>/dev/null | grep -q "accepting"; then
              echo "Tunnel ready."
              break
            fi
            sleep 1
          done
          pg_isready -h localhost -p 5432 || (echo "ERROR: DB tunnel failed" && exit 1)

      - name: Run Scraper
        env:
          PYTHONPATH: .
        run: |
          PLATFORM="${{ inputs.platform }}"
          TIME_RANGE="${{ inputs.time_range }}"
          DB_ENV="${{ inputs.environment }}"

          if [ -z "$PLATFORM" ]; then PLATFORM="longshanks+rollbetter"; fi
          if [ -z "$TIME_RANGE" ]; then TIME_RANGE="last week"; fi
          if [ -z "$DB_ENV" ]; then DB_ENV="prod"; fi

          # Build DATABASE_URL from secrets via SSH tunnel.
          # Secrets may be a full URL (postgres://user:pass@host/db) or just a password.
          # We extract the password and reconstruct a localhost tunnel URL.
          _extract_pass() {
            local raw="$1"
            if echo "$raw" | grep -q "://"; then
              python3 -c "from urllib.parse import urlparse; import sys; u=urlparse(sys.argv[1]); print(u.password or '')" "$raw"
            else
              echo "$raw"
            fi
          }

          if [ "$DB_ENV" = "prod" ]; then
            RAW="${{ secrets.PROD_DATABASE_URL }}"
            PASS=$(_extract_pass "$RAW")
            export DATABASE_URL="postgres://postgres:${PASS}@localhost:5432/postgres"
          elif [ "$DB_ENV" = "staging" ]; then
            RAW="${{ secrets.PROD_DATABASE_URL }}"
            PASS=$(_extract_pass "$RAW")
            export DATABASE_URL="postgres://postgres:${PASS}@localhost:5432/m3tacron_staging"
          fi

          OVERWRITE_FLAG=""
          if [ "${{ inputs.overwrite }}" = "true" ]; then
            OVERWRITE_FLAG="--overwrite"
          fi

          if [ "$DB_ENV" = "none" ]; then
            python -m backend.scripts.scrape_tournaments_sqlite \
              --sqlite-path scraped_tournaments.db \
              --platform "$PLATFORM" \
              --time-range "$TIME_RANGE" $OVERWRITE_FLAG
          else
            python -m backend.scripts.scrape_tournaments \
              --platform "$PLATFORM" \
              --time-range "$TIME_RANGE" \
              --sqlite-output scraped_tournaments.db $OVERWRITE_FLAG
          fi

      - name: Ensure pg_dump matches server version
        if: env.NEEDS_DB == 'true'
        run: |
          set -e
          # Server was upgraded to PG 18; the runner's default client is still
          # 16 and pg_dump fails with "server version mismatch" if they differ.
          # Use the same match-client logic as promote_staging.yml: query the
          # server and install the matching postgresql-client-* via PGDG.
          if [ -z "${SSH_AUTH_SOCK:-}" ] || [ -z "${SSH_AGENT_PID:-}" ]; then
            eval "$(ssh-agent -s)"
            printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > /tmp/m3tacron_deploy_key_pgver
            tail -c1 /tmp/m3tacron_deploy_key_pgver | read -r _ || echo >> /tmp/m3tacron_deploy_key_pgver
            chmod 600 /tmp/m3tacron_deploy_key_pgver
            ssh-add /tmp/m3tacron_deploy_key_pgver
          fi
          # Ensure tunnel exists (already running from earlier steps, but verify).
          if ! pg_isready -h localhost -p 5432 >/dev/null 2>&1; then
            ssh -f -N -L 5432:localhost:3000 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes audit-bot@84.8.253.2 || true
            for _ in $(seq 1 15); do pg_isready -h localhost -p 5432 >/dev/null 2>&1 && break; sleep 1; done
          fi
          RAW="${{ secrets.PROD_DATABASE_URL }}"
          PASS=$(python3 -c "from urllib.parse import urlparse; import sys; u=urlparse(sys.argv[1]); print(u.password or sys.argv[1])" "$RAW")
          export PGPASSWORD="$PASS"
          if ! command -v psql >/dev/null 2>&1; then
            echo "psql not yet available, installing postgresql-client..."
            sudo apt-get update && sudo apt-get install -y postgresql-client || true
          fi
          SERVER_MAJOR=$(psql -h localhost -p 5432 -U postgres -d postgres -t -A -c "SHOW server_version;" 2>/dev/null | cut -d. -f1 | tr -d '[:space:]')
          CLIENT_SHORT=$(pg_dump --version 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo "")
          echo "PostgreSQL server major: ${SERVER_MAJOR:-unknown}, pg_dump major: ${CLIENT_SHORT:-unknown}"
          if [ -n "$SERVER_MAJOR" ] && [ "$SERVER_MAJOR" != "$CLIENT_SHORT" ]; then
            echo "Installing postgresql-client-$SERVER_MAJOR to match server..."
            sudo install -d /etc/apt/keyrings
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
            echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
            sudo apt-get install -y "postgresql-client-$SERVER_MAJOR" || sudo apt-get install -y postgresql-client || true
          fi
          echo "pg_dump version in use: $(pg_dump --version)"
          # Verify match (non-fatal).
          NEW_SHORT=$(pg_dump --version 2>/dev/null | grep -oE '[0-9]+' | head -1 || echo "")
          if [ -n "$SERVER_MAJOR" ] && [ "$SERVER_MAJOR" != "$NEW_SHORT" ]; then
            echo "WARNING: pg_dump major $NEW_SHORT still differs from server $SERVER_MAJOR — backup may fail" >&2
          else
            echo "pg_dump/server version match OK: $NEW_SHORT"
          fi

      - name: Backup production database
        if: env.NEEDS_DB == 'true'
        run: |
          # Re-derive DB password (each step has a fresh shell; PASS from
          # the Run Scraper step is not persisted).
          _extract_pass() {
            local raw="$1"
            if echo "$raw" | grep -q "://"; then
              python3 -c "from urllib.parse import urlparse; import sys; u=urlparse(sys.argv[1]); print(u.password or '')" "$raw"
            else
              echo "$raw"
            fi
          }
          _DB_ENV="${{ inputs.environment }}"
          if [ -z "$_DB_ENV" ]; then _DB_ENV="prod"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then _DB_ENV="prod"; fi

          if [ "$_DB_ENV" = "prod" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            BACKUP_DB="postgres"
            RAW="${{ secrets.PROD_DATABASE_URL }}"
          elif [ "$_DB_ENV" = "staging" ]; then
            BACKUP_DB="m3tacron_staging"
            RAW="${{ secrets.PROD_DATABASE_URL }}"
          else
            echo "No DB target for backup, skipping."
            exit 0
          fi
          PASS=$(_extract_pass "$RAW")
          export PGPASSWORD="$PASS"

          # Backup is taken AFTER the scraper has committed (and bumped data_version).
          # Retention target: 3 daily + 1 weekly (prev. week) + 1 two-weeks ago + 1 monthly (max 6).
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_FILE="/tmp/${BACKUP_DB}_${STAMP}.dump"
          echo "Backing up ${BACKUP_DB} -> ${BACKUP_FILE}..."
          pg_dump -h localhost -p 5432 -U postgres -Fc -f "$BACKUP_FILE" "$BACKUP_DB"
          ls -lh "$BACKUP_FILE"

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "BACKUP_DB_NAME=$BACKUP_DB" >> "$GITHUB_ENV"
          # shellcheck disable=SC2129
          echo "PGPASSWORD=$PASS" >> "$GITHUB_ENV"

          # Enforce retention on the runner's /tmp (best-effort)
          python3 scripts/db_backup.py --dir /tmp --prefix "${BACKUP_DB}" --no-dump || true

      - name: Upload database backup
        if: always() && env.BACKUP_FILE != '' && hashFiles(env.BACKUP_FILE) != ''
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.BACKUP_DB_NAME }}-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 31

      - name: Rotate server-side backups and warm caches
        if: env.NEEDS_DB == 'true'
        run: |
          if [ -z "${BACKUP_FILE:-}" ] || [ ! -f "$BACKUP_FILE" ]; then
            echo "No backup file to rotate on server, skipping scp."
          else
            scp -o StrictHostKeyChecking=no -i /tmp/m3tacron_deploy_key \
              "$BACKUP_FILE" audit-bot@84.8.253.2:~/dumps/ || echo "scp to server failed (non-fatal)"
          fi
          ssh -o StrictHostKeyChecking=no -i /tmp/m3tacron_deploy_key audit-bot@84.8.253.2 "bash -s" << 'EOSSH' || echo "server rotation failed (non-fatal)"
          set -e
          PREFIX="${BACKUP_DB_NAME:-postgres}"
          if [ -f ~/m3tacron-catchup/scripts/db_backup.py ]; then
            python3 ~/m3tacron-catchup/scripts/db_backup.py --dir ~/dumps --prefix "$PREFIX" --no-dump 2>&1 || true
          elif [ -f ~/m3tacron/scripts/db_backup.py ]; then
            python3 ~/m3tacron/scripts/db_backup.py --dir ~/dumps --prefix "$PREFIX" --no-dump 2>&1 || true
          else
            python3 << 'PYEOF'
          import pathlib, datetime as dt, re, collections
          p = pathlib.Path.home() / 'dumps'
          today = dt.date.today()
          keep_daily = 3
          files = sorted(p.glob(f'{PREFIX}_*.dump'))
          by_day = collections.defaultdict(list)
          for f in files:
              m = re.search(r'_(\d{8})_', f.name)
              if m:
                  try:
                      d = dt.datetime.strptime(m.group(1), '%Y%m%d').date()
                      by_day[d].append(f)
                  except Exception:
                      pass
          newest_per_day = {d: max(fs, key=lambda x: x.name) for d, fs in by_day.items()}
          keep=set()
          for i in range(keep_daily):
              d=today-dt.timedelta(days=i)
              if d in newest_per_day: keep.add(newest_per_day[d])
          def newest_in(lo,hi):
              c=[(d,pp) for d,pp in newest_per_day.items() if lo <= (today-d).days <= hi and pp not in keep]
              return max(c, key=lambda t: t[0])[1] if c else None
          for lo,hi in [(4,7),(8,14),(28,31)]:
              v=newest_in(lo,hi)
              if v: keep.add(v)
          for f in files:
              if f not in keep:
                  print(f'Pruning {f.name}')
                  try: f.unlink()
                  except Exception as e: print(e)
          print(f'Kept {len(keep)} backups')
          PYEOF
          fi
          EOSSH

          echo "Warming API caches..."
          for base in "https://api.m3tacron.com" "https://api.dev.m3tacron.com" "http://127.0.0.1:8888"; do
            for path in "meta-snapshot?data_source=xwa" "meta-snapshot?data_source=xwa&epic=true" "meta-snapshot?data_source=legacy" "meta-snapshot?data_source=legacy&epic=true"; do
              curl -sf --max-time 30 "$base/api/$path" > /dev/null 2>&1 && echo "Warmed $base/api/$path" || true
            done
          done || true

      - name: Upload Scraped Tournaments Artifact
        if: always() && hashFiles('scraped_tournaments.db') != '' && github.event.inputs.upload_sqlite_artifact != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: scraped-tournaments-${{ github.run_id }}
          path: scraped_tournaments.db
          retention-days: 30

      - name: Commit and Push Changes
        if: env.NEEDS_DB == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/geocoding_cache.json
          if [ -f main.db ]; then git add main.db; fi
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
            exit 0
          fi
          git commit -m "Update tournament data and geocoding cache"
          # main is a protected branch — direct push is rejected. Push the
          # cache commit to a dedicated branch so it isn't lost; the job
          # must NOT fail because of branch protection.
          if git branch --show-current | grep -q '^main$'; then
            CACHE_BRANCH="data/geocoding-cache"
            git branch -f "$CACHE_BRANCH" HEAD
            git push -f origin "$CACHE_BRANCH" 2>/dev/null || echo "Cache push to $CACHE_BRANCH failed (non-fatal)"
          else
            git push 2>/dev/null || echo "Cache push failed (non-fatal)"
          fi
