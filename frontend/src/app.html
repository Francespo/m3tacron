<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>M3tacron — X-Wing Tournament Analytics &amp; Meta Engine</title>
		<meta name="description" content="Discover what's winning in Star Wars: X-Wing. In-depth tournament analytics, pilot and ship performance, popular squadron lists, and match data for XWA and Legacy." />
		<meta name="theme-color" content="#0a0a0a" />

		<!-- Open Graph / Facebook / Discord / LinkedIn -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://m3tacron.com/" />
		<meta property="og:site_name" content="M3tacron" />
		<meta property="og:title" content="M3tacron — X-Wing Tournament Analytics &amp; Meta Engine" />
		<meta property="og:description" content="Discover what's winning in Star Wars: X-Wing. In-depth tournament analytics, pilot and ship performance, popular squadron lists, and match data for XWA and Legacy." />
		<meta property="og:image" content="https://m3tacron.com/og-image.jpg" />
		<meta property="og:image:secure_url" content="https://m3tacron.com/og-image.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="M3tacron - X-Wing Tournament Analytics &amp; Meta Engine" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://m3tacron.com/" />
		<meta name="twitter:title" content="M3tacron — X-Wing Tournament Analytics &amp; Meta Engine" />
		<meta name="twitter:description" content="Discover what's winning in Star Wars: X-Wing. In-depth tournament analytics, pilot and ship performance, popular squadron lists, and match data for XWA and Legacy." />
		<meta name="twitter:image" content="https://m3tacron.com/og-image.jpg" />
		<meta name="twitter:image:alt" content="M3tacron - X-Wing Tournament Analytics &amp; Meta Engine" />

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="/fonts/xwing-miniatures-font/xwing-miniatures.css" />

		<!-- Privacy-friendly analytics: self-hosted Umami, no cookies, IP not stored.
		     data-domains keeps preview deployments and local dev out of the stats. -->
		<script
			defer
			src="https://stats.m3tacron.com/script.js"
			data-website-id="af3415b5-e0de-4d6e-9f5f-57382949b43a"
			data-domains="m3tacron.com,www.m3tacron.com"
		></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
